<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Creature Bake-off</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=IM+Fell+English+SC&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* Test bench: one photo in, every painter x every style out, side by side. Same server as the camera. */
:root{--walnut:#140d08;--parch:#ead9b0;--brass:#c9a24a;--ink:#2a1b10;--paper:#efe6cf;
  --disp:"IM Fell English SC",Georgia,serif;--body:"IM Fell English",Georgia,serif;--type:"Special Elite","Courier New",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--walnut);color:var(--parch);font:17px/1.4 var(--body);
  padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
main{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:400 30px var(--disp);margin:0;color:#f3dc93}
p{margin:0}
.card{background:var(--paper);color:var(--ink);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px}
label{font:12px var(--type);letter-spacing:.08em;text-transform:uppercase}
input[type=text],input[type=password],textarea{width:100%;font:17px var(--body);padding:9px;border:1px solid #6f5119;border-radius:4px;background:#f7f1de;color:var(--ink)}
textarea{min-height:70px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{min-height:46px;padding:10px 20px;border-radius:10px;border:1px solid #4a340d;color:var(--ink);font:17px var(--disp);
  background:linear-gradient(170deg,#f1da92,#c9a24a 45%,#9a7628);cursor:pointer}
button:disabled{filter:grayscale(.7) brightness(.8)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #6f5119;outline-offset:2px}
#preview{max-width:220px;border-radius:6px;display:block}
.status{font:14px var(--type)}
.meta{font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px}
figure{margin:0;background:#f4efe2;color:var(--ink);padding:8px 8px 10px;border-radius:4px}
figure img{width:100%;display:block;aspect-ratio:1;object-fit:cover;background:#ddd}
figcaption{font:13px/1.35 var(--type);padding-top:6px}
.err{color:#8a2a1c}
.photo-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
</style>
</head>
<body>
<main>
  <h1>Creature Bake-off</h1>
  <p>One photo and a reflection go in. The vision model reads them once, then every painter draws the creature in every style, so you can compare.</p>

  <form class="card" id="f">
    <div id="who" hidden>
      <div class="row">
        <div style="flex:1;min-width:140px"><label for="u">Name</label><input id="u" type="text" autocapitalize="none" autocomplete="off"></div>
        <div style="width:120px"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="4"></div>
      </div>
    </div>
    <p id="signed" class="status" hidden></p>
    <label for="file">Photo</label>
    <input id="file" type="file" accept="image/*">
    <label for="ref">How do you feel?</label>
    <textarea id="ref"></textarea>
    <div class="row"><button id="go" type="submit">Run the bake-off</button><span class="status" id="st"></span></div>
  </form>

  <div id="out"></div>
</main>
<script>
const API='https://ogljcibwiaryxoviwabs.supabase.co/functions/v1/api',KEY='sb_publishable_CunxnxbcXcsv9tnBg4FIfA_7qxtzwUE';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let user=null;try{const S=JSON.parse(localStorage.getItem('magicCamera.v1'));user=S&&S.user}catch(e){}
if(user){$('#signed').hidden=false;$('#signed').textContent='Signed in as '+user.username+' (from the camera).'}else $('#who').hidden=false;
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||('server '+r.status));return j}
async function shrink(file){const im=await createImageBitmap(file),k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.88)}
$('#f').addEventListener('submit',async e=>{e.preventDefault();const f=$('#file').files[0],st=$('#st'),go=$('#go'),out=$('#out');
  if(!f){st.textContent='Choose a photo first.';return}
  go.disabled=true;out.innerHTML='';
  try{
    if(!user){st.textContent='Signing in…';const r=await api({action:'login',username:$('#u').value.trim().toLowerCase(),pin:$('#pin').value.trim()});user={username:r.username,token:r.token}}
    const data=await shrink(f);st.textContent='Painting 8 creatures. This takes about a minute…';
    const t0=Date.now(),r=await api({action:'bakeoff',token:user.token,photo:data.split(',')[1],reflection:$('#ref').value});
    const c=r.creature||{};st.textContent=`Done in ${Math.round((Date.now()-t0)/1000)} s.`;
    out.innerHTML=`<div class="card"><div class="photo-row"><img id="preview" src="${data}" alt="Your photo">
      <div><p><b>${esc(c.name)}</b>, a ${esc(c.kind)}, born from the ${esc(c.subject)}. Mood: ${esc(c.mood)}.</p><p class="meta">${esc(c.look)}</p><p class="meta">${esc(c.lore)}</p>
      <p class="status">Read by ${esc(c.vision)}</p></div></div></div>
      <div class="grid">${(r.results||[]).map(x=>`<figure>${x.url?`<img src="${esc(x.url)}" alt="${esc(x.style)} by ${esc(x.painter)}" loading="lazy">`:`<p class="err">${esc(x.error)}</p>`}
      <figcaption>${esc((x.painter||'').split('/')[1])} · ${esc(x.style)}</figcaption></figure>`).join('')}</div>`;
  }catch(x){st.textContent=x.message}
  go.disabled=false});
</script>
</body>
</html>
